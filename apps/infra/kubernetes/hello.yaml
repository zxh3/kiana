apiVersion: v1
kind: Namespace
metadata:
  name: learning-yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-content
  namespace: learning-yaml
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><title>Hello Kubernetes</title></head>
      <body>
        <h1>Hello from plain Kubernetes YAML!</h1>
        <p>This page is stored in a ConfigMap and served by nginx.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-yaml
  namespace: learning-yaml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-yaml
  template:
    metadata:
      labels:
        app: hello-yaml
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: hello-content
---
apiVersion: v1
kind: Service
metadata:
  name: hello-yaml
  namespace: learning-yaml
spec:
  selector:
    app: hello-yaml
  ports:
    - name: http
      port: 80
      targetPort: http
