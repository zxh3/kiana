[project]
name = "mediaforge"
version = "0.1.0"
description = "Build browser-friendly photo and Live Photo releases from local originals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "osxphotos>=0.76.1",
]

[project.scripts]
mediaforge = "mediaforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaforge"]
