[tool.uv.workspace]
members = ["apps/infra", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["kiana-icloud", "kiana-web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ty.environment]
python-version = "3.11"
root = ["./apps/infra", "./packages/mediaforge/src"]

[tool.ty.src]
exclude = ["kiana-icloud", "kiana-web"]
